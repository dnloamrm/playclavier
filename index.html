    <script>
      /* Audio taps. Every connection to the context destination also feeds an AnalyserNode (drives the
         Kinetic mode). On mobile speakers the signal first goes through a master chain
         lowpass 3800 -> compressor -> gain(-4 dB) and uses the softer-envelope config. */
      (function () {

        var mobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone|Opera Mini|IEMobile/i.test(ua) ||

        if (mobile) { root.classList.add('is-mobile'); window.__audioConfig = 'audio/config.mobile.js'; }
        var chains = new WeakMap(), taps = new WeakMap(), rawConnect = AudioNode.prototype.connect;
        AudioNode.prototype.connect = function (dest) {
          if (typeof AudioDestinationNode !== 'undefined' && dest instanceof AudioDestinationNode && !this.__clavierMaster) {
            var ctx = dest.context, an = taps.get(ctx);
            if (!an) { an = ctx.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = 0.3; taps.set(ctx, an); window.__clavierAnalyser = an; }
            rawConnect.call(this, an);

              var ch = chains.get(ctx);

                var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3800; lp.Q.value = 0.7;
                var comp = ctx.createDynamicsCompressor();
                comp.threshold.value = -24; comp.knee.value = 30; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.25;
                var g = ctx.createGain(); g.gain.value = Math.pow(10, -4 / 20);

              }
              var rest = Array.prototype.slice.call(arguments, 1);
              return rawConnect.apply(this, [ch].concat(rest)), dest;
            }
          }
          return rawConnect.apply(this, arguments);
        };
      })();

  <script>
    /* Auto-Type with emotional concepts. Each concept sets the typing tempo:
       delay +/- randomVariation (ms) between characters, plus a breathing pause
       after punctuation. One real keydown per character (same MIDI step as a
       user keystroke). The poem is always typed to its final full stop; it only
       stops when the user types (a character/edit key), clicks elsewhere, or
       starts a new Auto-Type. Modifier keys and shortcuts (e.g. screenshots,
       copy) never interrupt it. */
    (function () {
      var CONCEPTS = [
        { id: 'melancholy', delay: 350, randomVariation: 150, poems: [
            "Play the silence between the notes.\nListen as the echoes drift into the dark,\nleaving only a gentle resonance behind.",
            "The house is quiet now, and the piano waits.\nEvery key still holds a little of the rain,\na little of the light that used to stay.",
            "Some songs are only ever half remembered.\nI let the last chord ring until it fades,\nand sit inside the stillness it leaves.",

        var text = input.value.slice(0, MAXLEN), n = text.length;
        if (!n) {
          var sp = 'ph|' + (Math.floor(now / 530) % 2) + '|' + W + 'x' + H;
          if (sp === lastSig) return; lastSig = sp;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H); drawPlaceholder(now); return;
        }
        var kk = Math.max(0, Math.min(1, (inten - START) / (IFULL - START))); kk = kk * kk * (3 - 2 * kk);   /* smoothstep from the start point to full intensity */
        var i, sum100 = 0;
        for (i = 0; i < n; i++) sum100 += adv(text.charAt(i));
        var gridW = W - 80, gridH = H - 80;
        var S0 = Math.min(MAXPX, gridW * (isMobile() ? .8 : .43) * 100 / Math.max(.01, sum100));
        var capR = capRatio(), base = H * .56, capIdle = S0 * capR;
        var mMax = Math.max(1, Math.min(3, (base - 40) / capIdle, .4 * gridH / capIdle));
        /* growth is proportional and around the middle of the word, which slides to the exact centre of the screen as
           the intensity rises; the stretch-up of single letters fades out so only the uniform growth remains */
        var cyRest = base - capIdle / 2, sc = Math.pow(Math.max(KMAX, 3.6 * H / capIdle), kk); window.__kin = { inten: inten, kk: kk, sc: sc, lev: lev };   /* at full intensity a letter is ~3.6 screens tall: no stroke ends or serifs stay visible */
        /* A note ONSET (sudden rise of the overall loudness above its recent average) fires once; between onsets the
           fluctuation of the sound is ignored. The loudness decides how high the letters go; WHICH letters go up, and
           by how much, is random each time, so growth never marches from left to right. */
        var vg = rms * 10 * gain;
        var fire = vg - slowG > .15 && now - lastG > 90;
        slowG += (vg - slowG) * Math.min(1, dt * 10);
        if (fire) lastG = now;
        var tg = Math.max(0, Math.min(LEVELS, Math.round(vg * LEVELS / 1.1)));
        for (i = 0; i < n; i++) {
          var cur = lev[i] || 0, pk = peak[i] || 0;
          if (fire && Math.random() < .65) {
            var t = Math.max(1, Math.round(tg * (.25 + .75 * Math.random())));
            if (t >= cur) { pk = t; hold[i] = now + PEAK_HOLD; }
          }
          if (cur < pk) cur = Math.min(pk, cur + RISE);                       /* quick, straight rise */
          else if (cur > 0 && now >= (hold[i] || 0)) { cur -= 1; pk = cur; hold[i] = now + STEP; }  /* straight, stepped fall */
          peak[i] = pk;
          lev[i] = cur;
        }
        /* nothing changed since the last painted frame (the usual idle case): do not repaint at all */
        var sel = Math.max(0, Math.min(n, input.selectionStart == null ? n : input.selectionStart));
        var sig = kk.toFixed(3) + '|' + text + '|' + sel + '|' + (Math.floor(now / 530) % 2) + '|' + W + 'x' + H + '|' + lev.slice(0, n).join(',');
        if (sig === lastSig) return;
        lastSig = sig;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
        ctx.save(); ctx.translate(W / 2, cyRest + (H / 2 - cyRest) * kk); ctx.transform(1, 0, -LEAN * kk, 1, 0, 0); ctx.scale(sc, sc); ctx.translate(-W / 2, -cyRest);
        var ws = new Array(n), total = 0;
        for (i = 0; i < n; i++) { ws[i] = adv(text.charAt(i)) * S0 / 100; total += ws[i]; }
        var x = (W - total) / 2, cum = new Array(n + 1);
        ctx.fillStyle = '#DFD8D8'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        for (i = 0; i < n; i++) {
          var ch = text.charAt(i), w = ws[i], m = 1 + (mMax - 1) * (lev[i] || 0) / LEVELS * (1 - kk), sk = 0; /* never deformed sideways: letters only stretch upward */
          if (ch !== ' ') {
            ctx.save(); ctx.translate(x + w / 2, base); ctx.transform(1, 0, -sk * m, m, 0, 0);
            ctx.font = '400 ' + S0.toFixed(1) + 'px ' + FONT; ctx.fillText(ch, 0, 0); ctx.restore();
          }
          cum[i] = x; x += w;
        }
        cum[n] = x;
        var sel = Math.max(0, Math.min(n, input.selectionStart == null ? n : input.selectionStart));
        if (Math.floor(now / 530) % 2 === 0) { ctx.fillStyle = '#DFD8D8'; ctx.fillRect(cum[sel] + (sel === n ? S0 * .03 : -S0 * .01), base - capIdle, Math.max(2, S0 * .012), capIdle); }
        ctx.restore();
      }
      /* Home is always the default page: a reload (or a stale link) on #kinetic lands on Home */
      if (location.hash === '#kinetic') history.replaceState(null, '', location.pathname + location.search);
    })();
  </script>
