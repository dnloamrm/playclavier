   (100% black or white with a 20% overlay). The user can paint bg / fg by hand, or press Randomize for a harmonic composition;
   colours are a free choice (Shuffle always gives a legible pair). Saved in localStorage and applied here, before the first paint.
   No saved colours = the default dark theme. */

  var PAL = ['#FFFFFF', null, '#EEE6E1', '#CFBFAC', '#4B2A28', '#866A4A', '#AC966A', '#F8E869', '#E3954A', '#D95736', '#8A1D34',
             '#D74CD9', '#CF9ED4', '#A58BDF', '#B4B3E1', '#6194D6', '#7EBFD9', '#D7E2DE', '#626F42', '#223E27', '#80CE56', '#B4CCB5'];
  var MIN = { text: 4.5, stroke: 3, ph: 3.1 };
  function rgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
  function hex(a) { return '#' + a.map(function (v) { v = Math.round(Math.max(0, Math.min(255, v))); return (v < 16 ? '0' : '') + v.toString(16); }).join('').toUpperCase(); }
  function lum(h) { var c = rgb(h).map(function (v) { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }
  function ratio(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }
  function mix(a, b, t) { var x = rgb(a), y = rgb(b); return hex([0, 1, 2].map(function (i) { return x[i] * t + y[i] * (1 - t); })); }
  function toHsl(h) {
    var c = rgb(h).map(function (v) { return v / 255; }), mx = Math.max(c[0], c[1], c[2]), mn = Math.min(c[0], c[1], c[2]), l = (mx + mn) / 2, s = 0, hh = 0;
    if (mx !== mn) { var d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); hh = mx === c[0] ? (c[1] - c[2]) / d + (c[1] < c[2] ? 6 : 0) : mx === c[1] ? (c[2] - c[0]) / d + 2 : (c[0] - c[1]) / d + 4; hh *= 60; }

    ['#4B2A28','#F8E869'], ['#F8E869','#4B2A28'], ['#0B0D0E','#B4B3E1'], ['#B4B3E1','#0B0D0E'], ['#0B0D0E','#7EBFD9'],

    ['#8A1D34','#F8E869'], ['#CFBFAC','#4B2A28'], ['#4B2A28','#CFBFAC'], ['#8A1D34','#D7E2DE'], ['#D7E2DE','#8A1D34'],

    ['#8A1D34','#CFBFAC'], ['#FFFFFF','#866A4A'], ['#866A4A','#FFFFFF'], ['#0B0D0E','#D95736'], ['#D95736','#0B0D0E'],

  ];
  /* The interface is made of:
       bg   page background
       fg   ONE colour for the typography, the borders, the icons and the labels
       ph   the placeholder, derived from bg: 100% black or white with a 20% overlay
     Randomize picks one of the 100 pairs above (never the same pair twice in a row, never the same background twice in a row). */
  function compose(prev) {
    var pool = PAIRS.filter(function (p) { return !prev || (p[0] !== prev.bg && !(p[0] === prev.bg && p[1] === prev.fg)); });
    var p = pool[Math.floor(Math.random() * pool.length)];

    c = c || {};

    return { bg: bg, fg: fg, ph: phColor(bg) };
  }
  function apply(c) {
    var s = document.documentElement.style, names = ['--c-bg', '--c-fg', '--c-ph', '--bgColor', '--textColor'];

    meta(m.bg);
  }
  var c = null;
  try {
    c = JSON.parse(localStorage.getItem('clavier-colors') || 'null');

  apply(window.__colors);
})();

    <script>
      /* Mobile speakers: the signal first goes through a master chain
         lowpass 3800 -> compressor -> gain(-4 dB) and uses the softer-envelope config. */
      (function () {
        var ua = navigator.userAgent || '';
        var mobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone|Opera Mini|IEMobile/i.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ||
          (window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches);
        var root = document.documentElement;
        if (mobile) { root.classList.add('is-mobile'); window.__audioConfig = 'audio/config.mobile.js'; }
        /* a narrow window gets the phone layout too (browser device emulation, resized windows), live: the class follows the width */
        var nq = window.matchMedia && window.matchMedia('(max-width: 820px)');
        function sync() { root.classList.toggle('is-mobile', mobile || !!(nq && nq.matches)); }
        if (nq) { sync(); if (nq.addEventListener) nq.addEventListener('change', sync); else if (nq.addListener) nq.addListener(sync); }
        if (!mobile) return;
        /* Share clip: the signal that reaches the speakers (after the master chain below, which wraps this) is ALSO copied into an in-memory MediaStream.
           Nothing is recorded by this alone; the clip recorder in the Share script only reads this stream during the first 10 s of a session. */
        (function () {
          var taps = new WeakMap(), base = AudioNode.prototype.connect;
          AudioNode.prototype.connect = function (dest) {
            if (typeof AudioDestinationNode !== 'undefined' && dest instanceof AudioDestinationNode) {
              try {
                var ctx = dest.context, t = taps.get(ctx);
                if (!t && ctx.createMediaStreamDestination) { t = ctx.createMediaStreamDestination(); taps.set(ctx, t); window.__tap = t; }
                if (t) base.call(this, t);
              } catch (e) {}
            }

          };
        })();
        var chains = new WeakMap(), rawConnect = AudioNode.prototype.connect;
        AudioNode.prototype.connect = function (dest) {
          if (typeof AudioDestinationNode !== 'undefined' && dest instanceof AudioDestinationNode && !this.__clavierMaster) {
            var ctx = dest.context;
            {
              var ch = chains.get(ctx);
              if (!ch) {
                var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3800; lp.Q.value = 0.7;
                var comp = ctx.createDynamicsCompressor();
                comp.threshold.value = -24; comp.knee.value = 30; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.25;
                var g = ctx.createGain(); g.gain.value = Math.pow(10, -4 / 20);

            }

          return rawConnect.apply(this, arguments);

      })();

    <script>
      /* Info view controller. The address bar always stays on the bare domain. */
      (function () {
        var ua = navigator.userAgent, safari = /iPad|iPhone|iPod/.test(ua) || (/^((?!chrome|android|crios|fxios).)*safari/i.test(ua));
        if (safari) { var cpt = HTMLMediaElement.prototype.canPlayType; HTMLMediaElement.prototype.canPlayType = function (t) { return /ogg|opus|vorbis/i.test(t) ? '' : cpt.call(this, t); }; }
      })();
      (function () {
        var root = document.documentElement;
        function isOpen() { return root.classList.contains('info-open'); }
        function field() { return document.querySelector('textarea'); }
        function open(push) {
          if (isOpen()) return;
          if (window.__autoStop) window.__autoStop();
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          root.classList.add('info-open');
          var v = document.getElementById('info-view'); if (v) v.focus({ preventScroll: true });
        }
        function close(fromPop) {
          if (!isOpen()) return;
          root.classList.remove('info-open');
          var t = field(); if (t) t.focus({ preventScroll: true });
        }
        window.__openInfo = function () { open(true); };
        window.__closeInfo = function () { close(false); };
        /* One address only: Info never touches the URL (no #info, no sub-links). An old /#info link simply lands on the home screen. */
        if (location.hash === '#info') history.replaceState(null, '', location.pathname + location.search);
        document.addEventListener('DOMContentLoaded', function () {
          var b = document.getElementById('info-close'); if (b) b.addEventListener('click', function () { close(false); });
        });
        /* While Info is open the keyboard must not play or type into the app behind it. */
        window.addEventListener('keydown', function (e) {
          if (!isOpen()) return;
          if (e.key === 'Escape') { close(false); e.preventDefault(); return; }
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          if (e.target && e.target.id === 'info-close' && (e.key === 'Enter' || e.key === ' ' || e.key === 'Tab')) return;
          e.stopImmediatePropagation();
          if (e.key !== 'Tab' && !/^(Arrow(Up|Down)|Page(Up|Down)|Home|End| )$/.test(e.key)) e.preventDefault();
        }, true);
      })();
