  <head><script>
/* Colours. The interface = ONE foreground colour (typography, borders, icons, labels), the background, and the placeholder
   (100% black or white with a 20% overlay). The user can paint bg / fg by hand, or press Randomize for a harmonic composition;
   fg always contrasts with bg (>= 4.5:1). Saved in localStorage and applied here, before the first paint.
   No saved colours = the default dark theme. */
(function () {
  var D = { bg: '#0B0D0E', fg: '#F9FAFA' };
  var PAL = ['#FFFFFF', null, '#EEE6E1', '#CFBFAC', '#4B2A28', '#866A4A', '#AC966A', '#F8E869', '#E3954A', '#D95736', '#8A1D34',
             '#D74CD9', '#CF9ED4', '#A58BDF', '#B4B3E1', '#6194D6', '#7EBFD9', '#D7E2DE', '#626F42', '#223E27', '#80CE56', '#B4CCB5'];
  var MIN = { text: 4.5, stroke: 3, ph: 3.1 };
  function rgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
  function hex(a) { return '#' + a.map(function (v) { v = Math.round(Math.max(0, Math.min(255, v))); return (v < 16 ? '0' : '') + v.toString(16); }).join('').toUpperCase(); }
  function lum(h) { var c = rgb(h).map(function (v) { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }
  function ratio(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }
  function mix(a, b, t) { var x = rgb(a), y = rgb(b); return hex([0, 1, 2].map(function (i) { return x[i] * t + y[i] * (1 - t); })); }
  function toHsl(h) {
    var c = rgb(h).map(function (v) { return v / 255; }), mx = Math.max(c[0], c[1], c[2]), mn = Math.min(c[0], c[1], c[2]), l = (mx + mn) / 2, s = 0, hh = 0;
    if (mx !== mn) { var d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); hh = mx === c[0] ? (c[1] - c[2]) / d + (c[1] < c[2] ? 6 : 0) : mx === c[1] ? (c[2] - c[0]) / d + 2 : (c[0] - c[1]) / d + 4; hh *= 60; }
    return [hh, s, l];
  }
  /* first colour of the list that reads well on `against`, else the one that reads best */
  function best(against, list) {
    var pick = list[0], top = 0;
    for (var i = 0; i < list.length; i++) { var r = ratio(list[i], against); if (r >= MIN.text) return list[i]; if (r > top) { top = r; pick = list[i]; } }
    return pick;

  function auto(bg) { return best(bg, ['#F9FAFA', '#171A1C', '#FFFFFF', '#000000']); }

    ['#FFFFFF','#223E27'], ['#223E27','#FFFFFF'], ['#0B0D0E','#B4CCB5'], ['#B4CCB5','#0B0D0E'], ['#0B0D0E','#CFBFAC'],
    ['#CFBFAC','#0B0D0E'], ['#EEE6E1','#4B2A28'], ['#4B2A28','#EEE6E1'], ['#0B0D0E','#80CE56'], ['#80CE56','#0B0D0E'],
    ['#4B2A28','#F8E869'], ['#F8E869','#4B2A28'], ['#0B0D0E','#B4B3E1'], ['#B4B3E1','#0B0D0E'], ['#0B0D0E','#7EBFD9'],
    ['#7EBFD9','#0B0D0E'], ['#EEE6E1','#223E27'], ['#223E27','#EEE6E1'], ['#4B2A28','#D7E2DE'], ['#D7E2DE','#4B2A28'],
    ['#F8E869','#223E27'], ['#223E27','#F8E869'], ['#FFFFFF','#8A1D34'], ['#8A1D34','#FFFFFF'], ['#D7E2DE','#223E27'],
    ['#223E27','#D7E2DE'], ['#0B0D0E','#CF9ED4'], ['#CF9ED4','#0B0D0E'], ['#0B0D0E','#E3954A'], ['#E3954A','#0B0D0E'],
    ['#EEE6E1','#8A1D34'], ['#8A1D34','#EEE6E1'], ['#4B2A28','#B4CCB5'], ['#B4CCB5','#4B2A28'], ['#F8E869','#8A1D34'],
    ['#8A1D34','#F8E869'], ['#CFBFAC','#4B2A28'], ['#4B2A28','#CFBFAC'], ['#8A1D34','#D7E2DE'], ['#D7E2DE','#8A1D34'],
    ['#223E27','#B4CCB5'], ['#B4CCB5','#223E27'], ['#0B0D0E','#A58BDF'], ['#A58BDF','#0B0D0E'], ['#0B0D0E','#AC966A'],
    ['#AC966A','#0B0D0E'], ['#4B2A28','#80CE56'], ['#80CE56','#4B2A28'], ['#CFBFAC','#223E27'], ['#223E27','#CFBFAC'],

    ['#7EBFD9','#4B2A28'], ['#223E27','#80CE56'], ['#80CE56','#223E27'], ['#B4B3E1','#223E27'], ['#223E27','#B4B3E1'],
    ['#7EBFD9','#223E27'], ['#223E27','#7EBFD9'], ['#4B2A28','#CF9ED4'], ['#CF9ED4','#4B2A28'], ['#0B0D0E','#D74CD9'],
    ['#D74CD9','#0B0D0E'], ['#FFFFFF','#626F42'], ['#626F42','#FFFFFF'], ['#CF9ED4','#223E27'], ['#223E27','#CF9ED4'],
    ['#8A1D34','#B4CCB5'], ['#B4CCB5','#8A1D34'], ['#4B2A28','#E3954A'], ['#E3954A','#4B2A28'], ['#CFBFAC','#8A1D34'],
    ['#8A1D34','#CFBFAC'], ['#FFFFFF','#866A4A'], ['#866A4A','#FFFFFF'], ['#0B0D0E','#D95736'], ['#D95736','#0B0D0E'],
    ['#E3954A','#223E27'], ['#223E27','#E3954A'], ['#8A1D34','#80CE56'], ['#80CE56','#8A1D34'], ['#8A1D34','#B4B3E1'],
    ['#B4B3E1','#8A1D34'], ['#8A1D34','#7EBFD9'], ['#7EBFD9','#8A1D34'], ['#4B2A28','#A58BDF'], ['#A58BDF','#4B2A28'],
  ];
  /* The interface is made of:
       bg   page background
       fg   ONE colour for the typography, the borders, the icons and the labels
       ph   the placeholder, derived from bg: 100% black or white with a 20% overlay
     Randomize picks one of the 100 pairs above (never the same pair twice in a row, never the same background twice in a row). */
  function compose(prev) {
    var pool = PAIRS.filter(function (p) { return !prev || (p[0] !== prev.bg && !(p[0] === prev.bg && p[1] === prev.fg)); });
    var p = pool[Math.floor(Math.random() * pool.length)];

  }
  function meta(c) { var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', c); }
  /* the full map for a saved / chosen state: an unset colour is the default one */
  function resolve(c) {
    c = c || {};
    var bg = c.bg || D.bg, fg = c.fg || D.fg;                    /* free choice: an unset colour is the default one, never derived from the other */
    return { bg: bg, fg: fg, ph: phColor(bg) };
  }
  function apply(c) {
    var s = document.documentElement.style, names = ['--c-bg', '--c-fg', '--c-ph', '--bgColor', '--textColor'];
    c = c || {};

    var v = { '--c-bg': m.bg, '--c-fg': m.fg, '--c-ph': m.ph, '--bgColor': m.bg, '--textColor': m.fg };
    for (var k in v) s.setProperty(k, v[k]);

    meta(m.bg);
  }
  var c = null;
  try {
    c = JSON.parse(localStorage.getItem('clavier-colors') || 'null');
    if (!c && localStorage.getItem('clavier-theme') === 'light') c = { bg: '#F9FAFA', fg: '#171A1C' };   /* the old light mode */
  } catch (e) {}

  window.__colorUtil = { apply: apply, resolve: resolve, compose: compose, PAIRS: PAIRS, ratio: ratio, lum: lum, toHsl: toHsl, phColor: phColor, auto: auto, autoBg: autoBg, D: D, PAL: PAL, MIN: MIN, LEGIBLE: MIN.text };
  apply(window.__colors);
})();

    <script>
      /* Mobile speakers: the signal first goes through a master chain
         lowpass 3800 -> compressor -> gain(-4 dB) and uses the softer-envelope config. */
      (function () {
        var ua = navigator.userAgent || '';
        var mobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone|Opera Mini|IEMobile/i.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ||
          (window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches);
        var root = document.documentElement;
        if (mobile) { root.classList.add('is-mobile'); window.__audioConfig = 'audio/config.mobile.js'; }
        /* a narrow window gets the phone layout too (browser device emulation, resized windows), live: the class follows the width */
        var nq = window.matchMedia && window.matchMedia('(max-width: 820px)');
        function sync() { root.classList.toggle('is-mobile', mobile || !!(nq && nq.matches)); }
        if (nq) { sync(); if (nq.addEventListener) nq.addEventListener('change', sync); else if (nq.addListener) nq.addListener(sync); }
        if (!mobile) return;
        var chains = new WeakMap(), rawConnect = AudioNode.prototype.connect;
        AudioNode.prototype.connect = function (dest) {
          if (typeof AudioDestinationNode !== 'undefined' && dest instanceof AudioDestinationNode && !this.__clavierMaster) {
            var ctx = dest.context;
            {
              var ch = chains.get(ctx);
              if (!ch) {
                var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3800; lp.Q.value = 0.7;
                var comp = ctx.createDynamicsCompressor();
                comp.threshold.value = -24; comp.knee.value = 30; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.25;
                var g = ctx.createGain(); g.gain.value = Math.pow(10, -4 / 20);
                lp.__clavierMaster = comp.__clavierMaster = g.__clavierMaster = true;
                rawConnect.call(lp, comp); rawConnect.call(comp, g); rawConnect.call(g, dest);
                ch = lp; chains.set(ctx, ch); window.__masterChain = ch;
              }
              var rest = Array.prototype.slice.call(arguments, 1);
              return rawConnect.apply(this, [ch].concat(rest)), dest;
            }
          }
          return rawConnect.apply(this, arguments);
        };
      })();
    </script>
    <script>
      /* Info view controller (runs before first paint so /#info opens instantly). */
      (function () {
        var ua = navigator.userAgent, safari = /iPad|iPhone|iPod/.test(ua) || (/^((?!chrome|android|crios|fxios).)*safari/i.test(ua));
        if (safari) { var cpt = HTMLMediaElement.prototype.canPlayType; HTMLMediaElement.prototype.canPlayType = function (t) { return /ogg|opus|vorbis/i.test(t) ? '' : cpt.call(this, t); }; }
      })();
      (function () {
        var root = document.documentElement;
        function isOpen() { return root.classList.contains('info-open'); }
        function field() { return document.querySelector('textarea'); }
        function open(push) {
          if (isOpen()) return;
          if (window.__autoStop) window.__autoStop();
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          root.classList.add('info-open');
          var v = document.getElementById('info-view'); if (v) v.focus({ preventScroll: true });
          if (push) history.pushState({ info: 1 }, '', '#info');
        }
        function close(fromPop) {
          if (!isOpen()) return;
          root.classList.remove('info-open');
          if (!fromPop) {
            if (history.state && history.state.info) history.back();
            else history.replaceState(null, '', location.pathname + location.search);
          }
          var t = field(); if (t) t.focus({ preventScroll: true });
        }
        window.__openInfo = function () { open(true); };
        window.__closeInfo = function () { close(false); };
        /* a refresh always lands on the home screen; a direct link to /#info still opens Info */
        var nav = window.performance && performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
        if (location.hash === '#info' && nav && nav.type === 'reload') history.replaceState(null, '', location.pathname + location.search);
        if (location.hash === '#info') root.classList.add('info-open');
        window.addEventListener('popstate', function () {
          if (location.hash === '#info') open(false); else close(true);
        });
        document.addEventListener('DOMContentLoaded', function () {
          var b = document.getElementById('info-close'); if (b) b.addEventListener('click', function () { close(false); });
        });
        /* While Info is open the keyboard must not play or type into the app behind it. */
        window.addEventListener('keydown', function (e) {
          if (!isOpen()) return;
          if (e.key === 'Escape') { close(false); e.preventDefault(); return; }
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          if (e.target && e.target.id === 'info-close' && (e.key === 'Enter' || e.key === ' ' || e.key === 'Tab')) return;
          e.stopImmediatePropagation();
          if (e.key !== 'Tab' && !/^(Arrow(Up|Down)|Page(Up|Down)|Home|End| )$/.test(e.key)) e.preventDefault();
        }, true);
      })();
    </script>

    <style>

      html { --btn: 60px; --edge: 40px; --dock-b: 40px; --gap: 12px; --block-gap: 24px; --clear: 32px; }
      html.is-mobile { --btn: 46px; --edge: 20px; --dock-b: 20px; --block-gap: 12px; --gap: var(--block-gap); --clear: 16px; }   /* phones: tight, every distance between button rows is the same 12px, and the text stops 16px above the buttons */
      #ui { position: fixed; inset: 0; z-index: 100; pointer-events: none; }

      .is-mobile #ui { inset: auto; left: 0; top: 0; width: 100%; height: var(--ui-h, 100dvh); transform: translate3d(0, var(--ui-top, 0px), 0); }   /* passive: only the buttons take clicks */
      /* buttons have no fill: the writing field ends above them (a clear band), so nothing scrolls underneath */

      #ui .corner svg { width: 20px; height: 20px; fill: currentColor; display: block; }   /* Material Symbols, Sharp, filled */

      }

        font: 400 13px/1 "Arizona Sans", sans-serif; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }   /* text only, above the Share button */
      #toast.on { display: block; }

        height: 100%; padding: 0 24px; border: 0; border-radius: 0; line-height: 1;
        font-size: 15px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap;
      }
      #ui .blk button + button { border-left: 1px solid var(--c-fg, #F9FAFA); }
      #ui .blk button:first-child { border-radius: 5px 0 0 5px; } #ui .blk button:last-child { border-radius: 0 5px 5px 0; }
      #ui .blk button:only-child { border-radius: 5px; }

      @media (max-width: 340px) { .is-mobile #ui .blk button { padding: 0 8px; font-size: 12px; letter-spacing: .04em; } }   /* the narrowest phones keep the dock to two rows */
      /* colour tools: background fill, text colour, randomise (icon buttons) + the palette strip. No hover / pressed / focus states anywhere. */

        display: flex; flex-wrap: wrap; box-sizing: border-box; overflow: hidden;
        width: calc(var(--sw) * 22 + 2px); border: 1px solid var(--c-fg, #F9FAFA); border-radius: 6px;
        opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility 0s linear .2s;
