    <script>
      /* Bootstrap: the only inline logic. It runs before the first paint, so the page appears already in the right theme and layout.
           - device: a phone (touch) or a narrow window gets the phone layout (class is-mobile); a window >= --bp-wide gets is-wide. The two
             breakpoints come from css/tokens-v1.css (--bp-narrow, --bp-wide); they are classes because CSS cannot read variables in a media query.
           - theme: the saved colours (validated against the palette) are written as CSS variables on <html>.
           - Clavier: the one global, a read-only namespace (sealed in js/main-v1.js).
         The tokens stylesheet and js/colors-v1.js are loaded above this script, so both are available here. */
      (function () {
        'use strict';
        var root = document.documentElement, cs = getComputedStyle(root);
        var token = function (n) { return cs.getPropertyValue(n).trim(); };
        var ns = window.Clavier = window.Clavier || {};
        var colors = ns.createColors({ bg: token('--default-bg'), fg: token('--default-fg') });

        /* ---- device ---- */
        var ua = navigator.userAgent || '';
        var phone = /Android|iPhone|iPad|iPod|Mobile|Windows Phone|Opera Mini|IEMobile/i.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ||
          (window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches);
        var nq = window.matchMedia('(max-width: ' + (+token('--bp-narrow')) + 'px)'), wq = window.matchMedia('(min-width: ' + (+token('--bp-wide')) + 'px)');
        var mobile = null, wide = null;
        function layout() {
          var m = phone || nq.matches, w = wq.matches;
          if (m === mobile && w === wide) return;
          mobile = m; wide = w;
          root.classList.toggle('is-mobile', m); root.classList.toggle('is-wide', w);
          window.dispatchEvent(new Event('clavier:layout'));
        }
        [nq, wq].forEach(function (q) { if (q.addEventListener) q.addEventListener('change', layout); else if (q.addListener) q.addListener(layout); });
        layout();
        /* the engine's own contract: which audio config it loads (the phone one has softer envelopes) */
        if (phone) window.__audioConfig = 'audio/config.mobile.js';

        /* ---- theme ---- */
        var choice = { bg: null, fg: null }, map = null, listeners = [];
        try {
          var raw = JSON.parse(localStorage.getItem('clavier-colors') || 'null');
          if (!raw && localStorage.getItem('clavier-theme') === 'light') raw = { bg: '#EEE6E1', fg: '#0B0D0E' };   /* the old light mode, as its nearest palette pair */
          var ok = colors.validate(raw); if (ok) choice = ok;
        } catch (e) {}
        function paint() {
          var s = root.style, names = ['--c-bg', '--c-fg', '--c-ph', '--c-glass', '--bgColor', '--textColor'];
          if (!choice.bg && !choice.fg) { names.forEach(function (n) { s.removeProperty(n); }); map = colors.resolve({}); }
          else {
            map = colors.resolve(choice);
            var v = { '--c-bg': map.bg, '--c-fg': map.fg, '--c-ph': map.ph, '--c-glass': map.glass, '--bgColor': map.bg, '--textColor': map.fg };   /* --bgColor / --textColor: read by the app bundle */
            for (var k in v) s.setProperty(k, v[k]);
          }
          var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', map.bg);
        }
        paint();
        var theme = {
          get choice() { return { bg: choice.bg, fg: choice.fg }; },        /* what the user picked (null = the default colour) */
          get map() { return map; },                                         /* what is on screen: bg, fg, ph, glass */
          set: function (c) {
            choice = { bg: c.bg || null, fg: c.fg || null }; paint();
            try { if (choice.bg || choice.fg) localStorage.setItem('clavier-colors', JSON.stringify(choice)); else localStorage.removeItem('clavier-colors'); localStorage.removeItem('clavier-theme'); } catch (e) {}
            listeners.forEach(function (fn) { fn(); });
          },
          onChange: function (fn) { listeners.push(fn); },
        };

        Object.defineProperty(ns, 'colors', { value: colors, enumerable: true });
        Object.defineProperty(ns, 'device', { value: Object.freeze({ phone: !!phone }), enumerable: true });
        Object.defineProperty(ns, 'theme', { value: theme, enumerable: true });

        /* one address only: the Info page never touches the URL; an old /#info link simply lands on the home screen */
        if (location.hash === '#info') history.replaceState(null, '', location.pathname + location.search);
      })();
