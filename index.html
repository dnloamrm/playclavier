      /* Mobile speakers: tame 2-6 kHz harshness. Master chain lowpass -> compressor -> gain(-4 dB) inserted
         in front of every connection to the context destination; softer envelope via audio/config.mobile.js. */

        var chains = new WeakMap(), rawConnect = AudioNode.prototype.connect;

              var comp = ctx.createDynamicsCompressor();

        function isOpen() { return root.classList.contains('info-open'); }
        function field() { return document.querySelector('textarea'); }
        function open(push) {
          if (isOpen()) return;
          if (window.__autoStop) window.__autoStop();
